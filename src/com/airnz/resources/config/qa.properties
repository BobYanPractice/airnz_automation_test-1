# QA Environment Configuration
# Air New Zealand Automation Framework

# Application URLs
base.url=https://www.airnewzealand.co.nz
api.base.url=https://api.airnewzealand.co.nz

# Environment
environment=qa
region=NZ

# Authentication
auth.type=bearer
auth.token.endpoint=/api/v1/auth/token

# Test User Credentials (for QA environment)
test.user.email=testuser@example.com
test.user.password=TestPassword123!
test.airpoints.number=123456789
test.airpoints.pin=1234

# Database (if needed)
db.host=qa-db.airnz.internal
db.port=5432
db.name=airnz_qa
db.user=qa_user
db.password=qa_password

# Timeouts (seconds)
connection.timeout=30
read.timeout=30
socket.timeout=30

# Retry Settings
retry.count=3
retry.delay=1000

# Feature Flags
feature.airpoints.enabled=true
feature.social.login.enabled=true
feature.promoCode.enabled=true

# Logging
log.level=INFO
log.directory=./logs

# Report Settings
report.directory=./reports
screenshot.on.failure=true
